name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android compile SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "::error::Android SDK command-line tools were not found under $sdk_root."
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses
          "$sdkmanager_path" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Configure persistent Debug signing
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/irminsul-debug.jks"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          keytool -list -keystore "$keystore_path" -storepass "$DEBUG_KEYSTORE_PASSWORD" -alias "$DEBUG_KEY_ALIAS" >/dev/null

          {
            echo "DEBUG_KEYSTORE_PATH=$keystore_path"
            echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
            echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
            echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Calculate unique Debug build version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          source version.properties

          if [[ ! "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::VERSION_CODE must be a positive integer."
            exit 1
          fi

          if [[ ! "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub Actions run number is invalid."
            exit 1
          fi

          debug_version_code=$((VERSION_CODE + GITHUB_RUN_NUMBER))
          if (( debug_version_code > 2100000000 )); then
            echo "::error::Calculated Debug versionCode exceeds Android's maximum."
            exit 1
          fi

          debug_version_name="${VERSION_NAME}-dev.${GITHUB_RUN_NUMBER}"
          {
            echo "APP_VERSION_CODE=${debug_version_code}"
            echo "APP_VERSION_NAME=${debug_version_name}"
          } >> "$GITHUB_ENV"

          echo "artifact_name=irminsul-codex-debug-v${debug_version_name}-vc${debug_version_code}" >> "$GITHUB_OUTPUT"
          echo "Debug version: ${debug_version_name} (${debug_version_code})"

      - name: Determine whether Room instrumentation tests are required
        id: room_tests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs always execute the complete test suite.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A missing/initial base commit must never cause tests to be skipped.
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          run_room_tests=false

          while IFS= read -r path; do
            case "$path" in
              app/src/androidTest/*) run_room_tests=true ;;
              app/src/main/java/com/irminsul/codex/data/local/*) run_room_tests=true ;;
              app/src/main/java/com/irminsul/codex/data/mapper/AccountExportMapper.kt) run_room_tests=true ;;
              app/src/main/java/com/irminsul/codex/domain/model/AccountSnapshot.kt) run_room_tests=true ;;
              app/src/main/java/com/irminsul/codex/domain/repository/AccountSnapshotStore.kt) run_room_tests=true ;;
              app/build.gradle.kts|gradle/libs.versions.toml|build.gradle.kts|settings.gradle.kts|gradle.properties) run_room_tests=true ;;
              .github/workflows/build.yml) run_room_tests=true ;;
            esac
            if [[ "$run_room_tests" == "true" ]]; then
              break
            fi
          done <<< "$changed_files"

          echo "run=$run_room_tests" >> "$GITHUB_OUTPUT"
          echo "Room instrumentation tests required: $run_room_tests"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Enable KVM for Android emulator when available
        if: steps.room_tests.outputs.run == 'true'
        id: kvm
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "KVM device is not available; using the existing TCG fallback."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          # The runner may create /dev/kvm before this udev rule is installed.
          # Apply the permission to the existing device node as well.
          sudo chmod 0666 /dev/kvm || true

          echo "KVM device details:"
          ls -l /dev/kvm
          id

          # Verify that the runner can open KVM and query its API, not merely
          # that the device node appears readable and writable.
          if python3 - <<'PY'
          import fcntl
          import os
          import sys

          try:
              fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
              try:
                  version = fcntl.ioctl(fd, 0xAE00, 0)  # KVM_GET_API_VERSION
              finally:
                  os.close(fd)

              if version != 12:
                  print(f"Unexpected KVM API version: {version}")
                  sys.exit(1)

              print(f"KVM device opened successfully; API version: {version}")
          except OSError as error:
              print(f"KVM cannot be used by this runner: {error}")
              sys.exit(1)
          PY
          then
            echo "KVM hardware acceleration is available."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "KVM is present but unusable; retaining the TCG fallback."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Room instrumentation tests
        if: steps.room_tests.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: ${{ steps.kvm.outputs.available != 'true' && 'yes' || '' }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-linux-hw-accel: ${{ steps.kvm.outputs.available != 'true' }}
          script: gradle connectedDebugAndroidTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify Room schema snapshot
        run: |
          schema="app/schemas/com.irminsul.codex.data.local.IrminsulDatabase/2.json"
          if [[ ! -s "$schema" ]]; then
            echo "::error::Room schema snapshot was not generated at $schema"
            exit 1
          fi

      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v7
        with:
          name: irminsul-room-schema-v2-run-${{ github.run_number }}
          path: app/schemas/com.irminsul.codex.data.local.IrminsulDatabase/2.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify Debug APK signature
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK Build Tools directory was not found."
            exit 1
          fi

          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner was not found in Android SDK Build Tools."
            exit 1
          fi

          echo "Using apksigner at: $apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$apksigner_path" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app_version.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/irminsul-debug.jks"
