name: Publish Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.8'

      - name: Validate release tag and version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi

          source version.properties
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$TAG_VERSION" != "$VERSION_NAME" ]]; then
            echo "Tag version ($TAG_VERSION) does not match VERSION_NAME ($VERSION_NAME)."
            exit 1
          fi

          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE must be a positive integer."
            exit 1
          fi

      - name: Run release unit-test gate
        run: gradle testDebugUnitTest --no-daemon

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub Actions secret: RELEASE_KEYSTORE_BASE64"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/irminsul-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "The decoded release keystore is empty or invalid."
            exit 1
          fi

          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "Missing RELEASE_KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret."; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret."; exit 1; }
          gradle assembleRelease --no-daemon

      - name: Verify APK signature and calculate checksum
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Irminsul Codex ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/irminsul-release.jks"
